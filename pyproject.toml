[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docpipe"
version = "0.1.0"
description = "Schema-driven document extraction: read, split, classify, extract, validate, map."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Baha Kırbaşoğlu" }]
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
azure = ["openai>=1.40", "azure-ai-documentintelligence>=1.0.0", "azure-core>=1.30"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
docpipe = "docpipe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
